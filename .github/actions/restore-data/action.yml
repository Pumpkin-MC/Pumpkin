name: Restore vanilla datapack
description: Restore the prepared data before Cargo starts compiling.
runs:
  using: composite
  steps:
    - name: Download vanilla datapack
      uses: actions/download-artifact@v8
      with:
        name: vanilla-datapack
        path: ${{ runner.temp }}/vanilla-datapack
    - name: Extract vanilla datapack
      shell: bash
      run: tar -xf - -C assets < "$RUNNER_TEMP/vanilla-datapack/vanilla-datapack.tar"
