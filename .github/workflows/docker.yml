# https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
name: deploy-docker-image

env:
  REGISTRY: ghcr.io
  GITHUB_REPOSITORY: ${{ github.repository }}

on:
  workflow_run:
    workflows:
      - "Nightly Release"
      - "Release"
    types:
      - completed
  push:
    branches:
      - "master"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      pumpkin_tag:
        description: "Release tag to package (e.g. nightly, canary, or a version tag)"
        required: false
        default: "nightly"
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  docker-build-deploy:
    if: >-
      github.repository == 'Pumpkin-MC/Pumpkin' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      pumpkin_tag: ${{ steps.release_tag.outputs.pumpkin_tag }}

    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-26.04-arm
            platform: linux/arm64
          - os: ubuntu-latest
            platform: linux/amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Set lowercase repository name
        run: |
          echo "REGISTRY_IMAGE=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Determine release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.pumpkin_tag }}" ]; then
            PUMPKIN_TAG="${{ inputs.pumpkin_tag }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.name }}" = "Release" ]; then
            if [ "${{ github.event.workflow_run.event }}" = "push" ] && [ -n "${{ github.event.workflow_run.head_branch }}" ]; then
              PUMPKIN_TAG="${{ github.event.workflow_run.head_branch }}"
            else
              PUMPKIN_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
            fi
          else
            PUMPKIN_TAG="nightly"
          fi
          echo "PUMPKIN_TAG=${PUMPKIN_TAG}" >> "$GITHUB_ENV"
          echo "pumpkin_tag=${PUMPKIN_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Login to GitHub CR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            PUMPKIN_TAG=${{ env.PUMPKIN_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: >-
      github.repository == 'Pumpkin-MC/Pumpkin' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    needs:
      - docker-build-deploy
    steps:
      - name: Set lowercase repository name
        run: |
          echo "REGISTRY_IMAGE=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Set release tag
        env:
          PUMPKIN_TAG: ${{ needs.docker-build-deploy.outputs.pumpkin_tag }}
        run: |
          echo "PUMPKIN_TAG=${PUMPKIN_TAG}" >> "$GITHUB_ENV"
          echo "DOCKER_RELEASE_TAG=${PUMPKIN_TAG//+/_}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.docker-build-deploy.outputs.pumpkin_tag != 'nightly' && needs.docker-build-deploy.outputs.pumpkin_tag != 'canary' && needs.docker-build-deploy.outputs.pumpkin_tag != 'latest' && needs.docker-build-deploy.outputs.pumpkin_tag || '' }}
          submodules: recursive

      - name: Download Digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Extract Versions
        id: versions
        run: |
          VERSION=$(awk -F '"' '/^version/ {print $2}' Cargo.toml)
          echo "PUMPKIN_VERSION=$(echo $VERSION | cut -d '+' -f 1)" >> $GITHUB_ENV
          echo "MC_VERSION=$(echo $VERSION | cut -d '+' -f 2)" >> $GITHUB_ENV

      - name: Login to GitHub CR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=master,enable=${{ env.PUMPKIN_TAG == 'nightly' }}
            type=raw,value=nightly,enable=${{ env.PUMPKIN_TAG == 'nightly' }}
            type=raw,value=${{ env.DOCKER_RELEASE_TAG }},enable=${{ env.PUMPKIN_TAG != 'nightly' }}
            type=raw,value=latest
            type=sha
            type=raw,value=mc${{ env.MC_VERSION }}
            type=raw,value=${{ env.PUMPKIN_VERSION }}
            type=raw,value=mc${{ env.MC_VERSION }}-${{ env.PUMPKIN_VERSION }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
