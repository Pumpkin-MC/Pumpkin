name: Release

on:
  push:
    tags:
      - "*"
      - "!nightly"
      - "!nightly*"
      - "!canary"
      - "!canary*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag name (optional, defaults to Cargo.toml version)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build_release:
    name: Build & Sign Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: X64
          - os: ubuntu-latest
            arch: X64-v3
            rustflags: -C target-cpu=x86-64-v3
          - os: ubuntu-26.04-arm
            arch: ARM64
          - os: windows-latest
            arch: X64
          - os: windows-latest
            arch: X64-v3
            rustflags: -C target-cpu=x86-64-v3
          - os: windows-11-arm
            arch: ARM64
          - os: macos-latest
            arch: ARM64
    env:
      RUSTFLAGS: -Dwarnings ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Build Release
        shell: bash
        run: cargo build --verbose --release

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ runner.os }}" == "Windows" ]; then EXT=".exe"; fi
          cp "target/release/pumpkin$EXT" "dist/pumpkin-${{ matrix.arch }}-${{ runner.os }}$EXT"

      - name: Upload unsigned Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ matrix.arch }}-${{ runner.os }}
          path: dist/pumpkin-*
          retention-days: 14

      - name: Export executable
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: pumpkin-${{ matrix.arch }}-${{ runner.os }}
          compression-level: 9
          path: dist/pumpkin-*

  sign_windows_release:
    name: Sign Windows release
    permissions:
      actions: read
    needs: build_release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: X64
          - os: windows-latest
            arch: X64-v3
          - os: windows-11-arm
            arch: ARM64
    steps:
      - name: Find unsigned artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: unsigned-${{ matrix.arch }}-${{ runner.os }}
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts | map(select(.name == env.ARTIFACT_NAME and .expired == false)) | first.id')
          test -n "$ARTIFACT_ID"
          echo "id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ secrets.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ secrets.SIGNPATH_RELEASE_SIGNING_POLICY_SLUG || secrets.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.artifact.outputs.id }}'
          wait-for-completion: true
          output-artifact-directory: dist/

      - name: Export signed executable
        uses: actions/upload-artifact@v7
        with:
          name: pumpkin-${{ matrix.arch }}-${{ runner.os }}
          compression-level: 9
          path: dist/pumpkin-*

  build_android_release:
    name: Build project in release for Android (AArch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - uses: Swatinem/rust-cache@v2
      - name: Build Release with cargo ndk
        env:
          CARGO_NDK_PLATFORM: 24
        run: cargo ndk -t arm64-v8a build --release --locked
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp "target/aarch64-linux-android/release/pumpkin" "dist/pumpkin-aarch64-android"
      - name: Export executable
        uses: actions/upload-artifact@v7
        with:
          name: pumpkin-aarch64-android
          compression-level: 9
          path: dist/pumpkin-aarch64-android

  publish_release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs: [build_release, sign_windows_release, build_android_release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(awk -F '"' '/^version/ {print $2}' Cargo.toml)
            TAG="${VERSION}"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "Determined release tag: ${TAG}"

      - name: Download prebuilt binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "pumpkin-*"
          path: dist/
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd dist
          sha256sum pumpkin-* > checksums.sha256
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          files: |
            dist/pumpkin*
            dist/checksums.sha256
          generate_release_notes: true
