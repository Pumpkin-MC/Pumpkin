name: Cargo Build, Test, and Linting

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      rust_toolchain_version:
        description: Rust toolchain version to use
        required: false
        default: stable
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI_RUST_TOOLCHAIN_VER: ${{ inputs.rust_toolchain_version || 'stable' }}
  RUSTFLAGS: "-Dwarnings"

jobs:
  prepare:
    name: Plan CI
    runs-on: ubuntu-latest
    outputs:
      affected_packages: ${{ steps.plan.outputs.affected_packages }}
      has_code: ${{ steps.plan.outputs.has_code }}
      run_full: ${{ steps.plan.outputs.run_full }}
      should_check_wit: ${{ steps.plan.outputs.should_check_wit }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Select affected packages
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python .github/scripts/ci_packages.py plan
          --event "${{ github.event_name }}"
          --base "$CI_BASE_SHA"
          --head "$CI_HEAD_SHA"
          --output "$GITHUB_OUTPUT"

  format:
    name: Check formatting
    needs: prepare
    if: needs.prepare.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup update ${{ env.CI_RUST_TOOLCHAIN_VER }} && rustup default ${{ env.CI_RUST_TOOLCHAIN_VER }}
      - run: rustup component add rustfmt
      - run: cargo fmt --check

  machete:
    name: Detect unused dependencies
    needs: prepare
    if: needs.prepare.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup update ${{ env.CI_RUST_TOOLCHAIN_VER }} && rustup default ${{ env.CI_RUST_TOOLCHAIN_VER }}
      - uses: bnjbvr/cargo-machete@main

  clippy:
    name: Run lints
    needs: prepare
    if: needs.prepare.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    env:
      CI_AFFECTED_PACKAGES: ${{ needs.prepare.outputs.affected_packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: rustup update ${{ env.CI_RUST_TOOLCHAIN_VER }} && rustup default ${{ env.CI_RUST_TOOLCHAIN_VER }}
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug-${{ runner.os }}-${{ runner.arch }}
      - name: Clippy affected packages
        run: >-
          python .github/scripts/ci_packages.py run --
          cargo clippy --all-targets --all-features

  clippy_release:
    name: Run release lints
    needs: prepare
    if: needs.prepare.outputs.run_full == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup update ${{ env.CI_RUST_TOOLCHAIN_VER }} && rustup default ${{ env.CI_RUST_TOOLCHAIN_VER }}
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --all-targets --all-features

  check_wit:
    name: Test `pumpkin-plugin-wit` against `wit-bindgen`
    needs: prepare
    if: needs.prepare.outputs.should_check_wit == 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: "crates/pumpkin-plugin-wit"
      - uses: bytecodealliance/actions/wit-bindgen/setup@v1
      - run: wit-bindgen rust crates/pumpkin-plugin-wit/v0.1
      - run: wit-bindgen rust crates/pumpkin-plugin-wit/v0.2

  test:
    name: Test (${{ matrix.name }})
    needs: [prepare, format, machete, clippy, check_wit]
    if: >-
      !cancelled() &&
      needs.prepare.outputs.has_code == 'true' &&
      needs.format.result == 'success' &&
      needs.machete.result == 'success' &&
      needs.clippy.result == 'success' &&
      (needs.check_wit.result == 'success' || needs.check_wit.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.test_matrix) }}
    env:
      CI_AFFECTED_PACKAGES: ${{ needs.prepare.outputs.affected_packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: rustup update ${{ env.CI_RUST_TOOLCHAIN_VER }} && rustup default ${{ env.CI_RUST_TOOLCHAIN_VER }}
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug-${{ runner.os }}-${{ runner.arch }}
      - name: Test affected packages
        run: >-
          python .github/scripts/ci_packages.py run --
          cargo nextest run --verbose --no-tests=pass
      - name: Test affected package documentation
        run: >-
          python .github/scripts/ci_packages.py run --
          cargo test --doc --verbose

  test_android:
    name: Test on Android AArch64
    needs: [prepare, format, machete, clippy, check_wit]
    if: >-
      !cancelled() &&
      needs.prepare.outputs.run_full == 'true' &&
      needs.format.result == 'success' &&
      needs.machete.result == 'success' &&
      needs.clippy.result == 'success' &&
      (needs.check_wit.result == 'success' || needs.check_wit.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup update ${{ env.CI_RUST_TOOLCHAIN_VER }} && rustup default ${{ env.CI_RUST_TOOLCHAIN_VER }}
      - run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-debug-${{ runner.os }}-${{ runner.arch }}
      - run: cargo install cargo-ndk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start Android emulator and test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CARGO_NDK_PLATFORM: 24
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: cargo ndk-test -t arm64-v8a

  build_pull_request:
    name: Build affected packages
    needs: [prepare, test]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.prepare.outputs.has_code == 'true' &&
      needs.test.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Linux ARM64
            os: ubuntu-26.04-arm
          - name: Windows x64
            os: windows-latest
          - name: Windows ARM64
            os: windows-11-arm
          - name: macOS
            os: macos-latest
    env:
      CI_AFFECTED_PACKAGES: ${{ needs.prepare.outputs.affected_packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: rustup update ${{ env.CI_RUST_TOOLCHAIN_VER }} && rustup default ${{ env.CI_RUST_TOOLCHAIN_VER }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug-${{ runner.os }}-${{ runner.arch }}
      - name: Build affected packages
        run: >-
          python .github/scripts/ci_packages.py run --
          cargo build --verbose

  build_android_pull_request:
    name: Build affected packages for Android AArch64
    needs: [prepare, test, test_android]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.prepare.outputs.has_code == 'true' &&
      needs.test.result == 'success' &&
      (needs.test_android.result == 'success' ||
      needs.test_android.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      CI_AFFECTED_PACKAGES: ${{ needs.prepare.outputs.affected_packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: rustup update ${{ env.CI_RUST_TOOLCHAIN_VER }} && rustup default ${{ env.CI_RUST_TOOLCHAIN_VER }}
      - run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-debug-${{ runner.os }}-${{ runner.arch }}
      - run: cargo install cargo-ndk
      - name: Build affected packages
        env:
          CARGO_NDK_PLATFORM: 24
        run: >-
          python .github/scripts/ci_packages.py run --
          cargo ndk -t arm64-v8a build --locked

  build_release:
    name: Build project in release
    needs: [prepare, clippy_release, test, test_android]
    if: needs.prepare.outputs.run_full == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Linux ARM64
            os: ubuntu-26.04-arm
          - name: Windows x64
            os: windows-latest
          - name: Windows ARM64
            os: windows-11-arm
          - name: macOS
            os: macos-latest
    env:
      # Full LTO with one codegen unit is too slow and memory hungry to run on every push.
      # The nightly workflow builds the shipped binaries with the release profile as is.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup update ${{ env.CI_RUST_TOOLCHAIN_VER }} && rustup default ${{ env.CI_RUST_TOOLCHAIN_VER }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --verbose --release

  build_release_musl:
    name: Build project in release (musl, ${{ matrix.name }})
    needs: [prepare, clippy_release, test, test_android]
    if: needs.prepare.outputs.run_full == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: Linux ARM64
            os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup update ${{ env.CI_RUST_TOOLCHAIN_VER }} && rustup default ${{ env.CI_RUST_TOOLCHAIN_VER }}
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build release
        run: cargo build --verbose --release --target ${{ matrix.target }}

  build_android_release:
    name: Build project in release for Android AArch64
    needs: [prepare, clippy_release, test, test_android]
    if: needs.prepare.outputs.run_full == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup update ${{ env.CI_RUST_TOOLCHAIN_VER }} && rustup default ${{ env.CI_RUST_TOOLCHAIN_VER }}
      - run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk
      - name: Build release with cargo ndk
        env:
          CARGO_NDK_PLATFORM: 24
        run: cargo ndk -t arm64-v8a build --release --locked
