[package]
name = "pumpkin-wasm-host"
version.workspace = true
description = "WebAssembly plugin host for the Pumpkin server."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# Plugins built against the v0.2 API. Off until the v0.2 ABI is finished; without it a v0.2
# plugin is rejected at load time and the v0.2 host stays out of the server binary.
v0_2 = ["dep:pumpkin-wasm-host-v0_2"]

[dependencies]
pumpkin-core.workspace = true
pumpkin-wasm-host-common.workspace = true
pumpkin-wasm-host-v0_1.workspace = true
pumpkin-wasm-host-v0_2 = { workspace = true, optional = true }
pumpkin-plugin-runtime.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
