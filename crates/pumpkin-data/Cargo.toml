[dependencies]
phf = { workspace = true, optional = true }
pumpkin-util = { workspace = true, optional = true }
pumpkin-nbt = { workspace = true, optional = true }
serde = {workspace = true, features = ["rc"], optional = true }
crc-fast = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "has_random_ticks"
harness = false

[package.metadata.cargo-machete]
ignored = ["phf"]

[lints]
workspace = true
