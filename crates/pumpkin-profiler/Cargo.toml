[package]
name = "pumpkin-profiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Heap memory and tick CPU profiling for Pumpkin."

[target.'cfg(all(any(target_os = "windows", target_os = "macos", all(target_os = "linux", target_env = "gnu")), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
memory-stats = { version = "1.2.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
flate2.workspace = true
backtrace = "0.3.76"
prost = "0.14.4"
tokio = { workspace = true, features = ["sync"] }
uuid.workspace = true

[target.'cfg(all(any(target_os = "macos", all(target_os = "linux", target_env = "gnu")), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
libc.workspace = true
rpprof = { version = "0.18.3", default-features = false, features = ["framehop-unwinder", "flamegraph", "prost-codec"] }

[target.'cfg(all(target_os = "windows", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints]
workspace = true
