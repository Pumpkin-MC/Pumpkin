[package]
name = "pumpkin-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pumpkin-nbt.workspace = true
pumpkin-codecs.workspace = true
serde.workspace = true
# Native plugins share `Style` with the server, and the `serde_json::Value` in `ItemComponents`
# changes layout with `preserve_order`. Enable it here so it doesn't depend on the rest of the build.
serde_json = { workspace = true, features = ["preserve_order"] }
bytes.workspace = true

num-traits.workspace = true

colored.workspace = true
md5.workspace = true
quote = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }

uuid.workspace = true
dashmap.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }

[features]
default = []
codegen = ["dep:syn", "dep:quote", "dep:proc-macro2"]

[[bench]]
name = "perlin"
harness = false

[lints]
workspace = true
