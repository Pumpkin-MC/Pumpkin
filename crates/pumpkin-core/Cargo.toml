[package]
name = "pumpkin-core"
version.workspace = true
description = "Empowering everyone to host fast and efficient Minecraft servers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Required to expose pumpkin plugin API
[lib]
doctest = false

[dependencies]
# pumpkin
arc-swap.workspace = true
rayon.workspace = true
pumpkin-util.workspace = true
pumpkin-auth.workspace = true
pumpkin-nbt.workspace = true
pumpkin-config.workspace = true
pumpkin-command.workspace = true
pumpkin-inventory.workspace = true
pumpkin-world.workspace = true
pumpkin-data = { workspace = true, features = ["default"] }
pumpkin-protocol = { workspace = true, features = ["default"] }
pumpkin-macros.workspace = true
pumpkin-gametest = { path = "../pumpkin-gametest" }

dashmap.workspace = true
crossbeam.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "io-std",
    "signal",
    "fs",
    "io-util",
    "time",
] }
thiserror.workspace = true
futures.workspace = true
notify.workspace = true

# config
serde.workspace = true
serde_repr.workspace = true
serde_json.workspace = true

colored.workspace = true

bytes.workspace = true

rand.workspace = true

num-bigint.workspace = true

# Console line reading
rustyline.workspace = true

# encryption
aes.workspace = true
rsa.workspace = true

# verification & WASM parsing
ed25519-dalek.workspace = true
hex.workspace = true

# authentication
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true

sha1.workspace = true

# velocity en
hmac.workspace = true
sha2.workspace = true

base64.workspace = true

# logging
tracing.workspace = true
tracing-subscriber.workspace = true

time = { workspace = true, features = ["parsing", "macros", "local-offset"] }

# plugins
libloading.workspace = true
rustc-hash.workspace = true

# Task handling
tokio-util = { workspace = true, features = ["rt"] }

# System details & Rustc version
libc = { workspace = true }
sysinfo.workspace = true
rustc_version_runtime.workspace = true

flate2.workspace = true

axum.workspace = true
webrtc.workspace = true
async-trait.workspace = true

ordered-float.workspace = true


bitflags = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }

indexmap.workspace = true
xxhash-rust.workspace = true


[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
