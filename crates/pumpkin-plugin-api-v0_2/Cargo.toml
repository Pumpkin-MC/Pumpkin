[package]
name = "pumpkin-plugin-api-v0_2"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
wit-bindgen = { workspace = true, features = ["async"] }

tracing.workspace = true
postcard.workspace = true
tracing-serde-structured.workspace = true
serde_json.workspace = true

# DO NOT BUILD FOR WASM / HOST ONLY
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
wasmtime = { workspace = true }
pumpkin-plugin-compose = { path = "../../tools/pumpkin-plugin-compose" }

[[example]]
name = "component_fixture"
path = "tests/fixture/component.rs"
crate-type = ["cdylib"]

[lints]
workspace = true

[[example]]
name = "sdk_helpers"
crate-type = ["cdylib"]
