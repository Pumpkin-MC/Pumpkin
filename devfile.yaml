schemaVersion: 2.3.0

metadata:
  name: pumpkin
  displayName: Pumpkin
  description: Development workspace for the Pumpkin Minecraft server

attributes:
  controller.devfile.io/storage-type: per-workspace

components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      mountSources: true

      cpuRequest: "2"
      memoryRequest: 4Gi
      memoryLimit: 16Gi

      env:
        - name: RUST_BACKTRACE
          value: "1"

      endpoints:
        - name: minecraft
          targetPort: 25565
          exposure: internal
          protocol: tcp
